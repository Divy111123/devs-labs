
{% extends "base.html" %}

{% if task %}
    {% set page_title = "Edit Task" %}
{% else %}
    {% set page_title = "Create Task" %}
{% endif %}

{% block title %}{{ page_title }} - TaskFlow{% endblock %}

{% block content %}

<div class="form-container">

    <div class="form-header">
        <h1>{{ page_title }}</h1>
        <p>Add the details of your task.</p>
    </div>


    <form method="POST" class="task-form">

        <div class="form-group">

            <label for="title">
                Task Title
            </label>

            <input
                type="text"
                id="title"
                name="title"
                placeholder="Example: Learn Kubernetes"
                value="{{ task.title if task else '' }}"
                required>

        </div>


        <div class="form-group">

            <label for="description">
                Description
            </label>

            <textarea
                id="description"
                name="description"
                rows="5"
                placeholder="Describe what you need to complete...">{{ task.description if task else '' }}</textarea>

        </div>


        <div class="form-row">

            <div class="form-group">

                <label for="priority">
                    Priority
                </label>

                <select id="priority" name="priority">

                    <option value="Low"
                        {% if task and task.priority == "Low" %}selected{% endif %}>
                        Low
                    </option>

                    <option value="Medium"
                        {% if not task or task.priority == "Medium" %}selected{% endif %}>
                        Medium
                    </option>

                    <option value="High"
                        {% if task and task.priority == "High" %}selected{% endif %}>
                        High
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="category">
                    Category
                </label>

                <select id="category" name="category">

                    <option value="DevOps"
                        {% if not task or task.category == "DevOps" %}selected{% endif %}>
                        DevOps
                    </option>

                    <option value="Cloud"
                        {% if task and task.category == "Cloud" %}selected{% endif %}>
                        Cloud
                    </option>

                    <option value="Development"
                        {% if task and task.category == "Development" %}selected{% endif %}>
                        Development
                    </option>

                    <option value="Personal"
                        {% if task and task.category == "Personal" %}selected{% endif %}>
                        Personal
                    </option>

                </select>

            </div>

        </div>


        <div class="form-row">

            <div class="form-group">

                <label for="due_date">
                    Due Date
                </label>

                <input
                    type="date"
                    id="due_date"
                    name="due_date"
                    value="{{ task.due_date if task else '' }}"
                    required>

            </div>


            <div class="form-group">

                <label for="due_time">
                    Due Time
                </label>

                <input
                    type="time"
                    id="due_time"
                    name="due_time"
                    value="{{ task.due_time if task else '' }}">

            </div>

        </div>


        <div class="form-actions">

            <a href="{{ url_for('dashboard') }}"
               class="btn secondary">
                Cancel
            </a>

            <button type="submit"
                    class="btn primary">

                {% if task %}
                    Update Task
                {% else %}
                    Create Task
                {% endif %}

            </button>

        </div>

    </form>

</div>

{% endblock %}
```
